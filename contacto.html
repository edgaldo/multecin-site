<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto | MULTECIN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="navbar"></div>

  <main class="container py-5">
    <h1 class="text-center mb-4"><i class="fas fa-envelope me-2 text-info"></i>Contáctanos</h1>
    <p class="text-center mb-5">¿Tienes preguntas o quieres trabajar con nosotros? Envíanos un mensaje.</p>

    <form action="https://formsubmit.co/contacto@multecin.com" method="POST" class="row g-3">
      <!-- Opcional: evitar spam -->
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="https://multecin.com/gracias.html">

      <div class="col-md-6">
        <input type="text" name="nombre" class="form-control" placeholder="Tu nombre" required>
      </div>
      <div class="col-md-6">
        <input type="email" name="email" class="form-control" placeholder="Tu correo" required>
      </div>
      <div class="col-12">
        <textarea name="mensaje" rows="5" class="form-control" placeholder="Tu mensaje" required></textarea>
      </div>
      <div class="col-12 text-center">
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-paper-plane me-2"></i>Enviar mensaje
        </button>
      </div>
    </form>
  </main>

<!-- Botón flotante de WhatsApp -->
  <a href="https://wa.me/593999999999?text=Hola%20MULTECIN,%20quiero%20más%20información" class="whatsapp-float" target="_blank" title="Escríbenos por WhatsApp">
    <i class="fab fa-whatsapp"></i>
  </a>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/scripts.js"></script>
</body>
</html>
